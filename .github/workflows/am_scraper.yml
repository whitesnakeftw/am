name: am scraper

on:
  workflow_dispatch:
  schedule:
    # All days (UTC times)
    - cron: '50 16 * * *'
    - cron: '40 19 * * *'
    # Weekdays (UTC times)
    - cron: '30 10 * * 1-5'
    # Weekends: Sat & Sun (UTC times)
    - cron: '20 11 * * 6,0'
    - cron: '50 13 * * 6,0'
    - cron: '55 18 * * 6,0'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4

      - name: Run events scraper
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python am_events.py
      
      - name: Run sk scraper
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python am_sk.py

      - name: Check whether tag '1.0.0' exists # only needed for the first run
        id: tag_check
        run: |
          # fetch remote refs and check for the tag; set output for later conditional
          if git ls-remote --tags origin refs/tags/1.0.0 | grep -q 'refs/tags/1.0.0'; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete release andtag
        if: steps.tag_check.outputs.exists == 'true'
        run: gh release delete "1.0.0" --cleanup-tag --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.m3u8"
          allowUpdates: true
          generateReleaseNotes: false
          replacesArtifacts: true
          removeArtifacts: true
          prerelease: false
          draft: false
          makeLatest: true
          tag: 1.0.0