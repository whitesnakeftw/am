name: tw scraper

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '58 19 * * *'

env:
  RELEASE_TAG: 'tw'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-streamlink-${{ hashFiles('.github/workflows/tw_scraper.yml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade streamlink

      - name: Run scraper
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python tw.py

      - name: Check whether tag exists # only needed for the first run
        id: tag_check
        run: |
          # fetch remote refs and check for the tag; set output for later conditional
          if git ls-remote --tags origin refs/tags/$RELEASE_TAG | grep -q "refs/tags/$RELEASE_TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete release and tag
        if: steps.tag_check.outputs.exists == 'true'
        run: gh release delete "$RELEASE_TAG" --cleanup-tag --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Wait for deletion to propagate
        if: steps.tag_check.outputs.exists == 'true'
        run: sleep 10
        shell: bash

      - name: Verify tag and release deletion
        if: steps.tag_check.outputs.exists == 'true'
        run: |
          if git ls-remote --tags origin refs/tags/$RELEASE_TAG | grep -q "refs/tags/$RELEASE_TAG"; then
            echo "Tag still exists!"; exit 1;
          fi
          gh release view "$RELEASE_TAG" && { echo "Release still exists!"; exit 1; } || echo "Release deleted."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "*.m3u8"
          allowUpdates: false
          generateReleaseNotes: false
          replacesArtifacts: true
          removeArtifacts: true
          prerelease: false
          draft: false
          makeLatest: false
          tag: ${{ env.RELEASE_TAG }}